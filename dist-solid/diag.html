<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MABIS diagnostics</title>
<!--
  A self-contained diagnostic page.

  It imports nothing from the app and is not part of any bundle, so it still
  works when the app itself is broken — which is exactly when it is needed. Open
  it on whichever surface is misbehaving (preview or published) and screenshot
  the result; every line is a fact I otherwise have to guess at from source.
-->
<style>
  body { margin:0; padding:16px; background:#11131a; color:#e8e3d8;
         font:13px/1.55 ui-monospace, monospace; }
  h1 { font-size:15px; margin:0 0 4px; letter-spacing:.14em; text-transform:uppercase; }
  p.sub { margin:0 0 16px; opacity:.55; font-size:11px; }
  section { border:1px solid #ffffff22; border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  h2 { font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.6; margin:0 0 8px; }
  .row { display:flex; gap:10px; padding:2px 0; }
  .k { flex:0 0 42%; opacity:.6; word-break:break-all; }
  .v { flex:1; word-break:break-all; }
  .ok   { color:#5fd08a; }
  .bad  { color:#ff7a7a; }
  .warn { color:#eace54; }
</style>
</head>
<body>
<h1>MABIS diagnostics</h1>
<p class="sub" id="stamp"></p>
<div id="out">running…</div>

<script>
const out = document.getElementById("out");
document.getElementById("stamp").textContent =
  location.origin + "  ·  " + new Date().toISOString();

const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
const row = (k, v, cls) => `<div class="row"><div class="k">${esc(k)}</div><div class="v ${cls||""}">${esc(v)}</div></div>`;
const sec = (t, rows) => `<section><h2>${esc(t)}</h2>${rows.join("")}</section>`;

(async () => {
  const blocks = [];

  /* ── service worker ─────────────────────────────────────────────────── */
  const swRows = [];
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    const ctrl = navigator.serviceWorker.controller;
    swRows.push(row("registrations", regs.length, regs.length ? "warn" : "ok"));
    swRows.push(row("controlling this page", ctrl ? "YES" : "no", ctrl ? "warn" : "ok"));
    if (ctrl) swRows.push(row("script", ctrl.scriptURL));
    for (const r of regs) {
      swRows.push(row("scope", r.scope));
      swRows.push(row("state", [r.installing && "installing", r.waiting && "WAITING", r.active && "active"].filter(Boolean).join(", ")));
    }
  } catch (e) { swRows.push(row("error", e.message, "bad")); }
  blocks.push(sec("service worker", swRows));

  /* ── caches ─────────────────────────────────────────────────────────── */
  const cRows = [];
  try {
    const keys = await caches.keys();
    cRows.push(row("cache names", keys.length ? keys.join(", ") : "(none)", keys.length ? "" : "ok"));
    for (const k of keys) {
      const c = await caches.open(k);
      const reqs = await c.keys();
      cRows.push(row(k + " entries", reqs.length));
      const css = reqs.map(r => new URL(r.url).pathname).filter(p => p.endsWith(".css"));
      if (css.length) cRows.push(row(k + " css", css.join("  ")));
    }
  } catch (e) { cRows.push(row("error", e.message, "bad")); }
  blocks.push(sec("cache storage", cRows));

  /* ── what the live build actually is ────────────────────────────────── */
  const bRows = [];
  for (const path of ["/sw.js", "/index.html"]) {
    try {
      const res = await fetch(path, { cache: "no-store" });
      const text = await res.text();
      bRows.push(row(path, res.status + " " + res.statusText, res.ok ? "ok" : "bad"));
      const rev = text.match(/SHELL_CACHE\s*=\s*"([^"]+)"/) || text.match(/mabis-shell-([a-z0-9]+)/i);
      if (rev) bRows.push(row("shell revision", rev[1]));
      const assets = [...text.matchAll(/assets\/([A-Za-z0-9._-]+\.(?:js|css))/g)].map(m => m[1]);
      if (assets.length) bRows.push(row(path + " references", [...new Set(assets)].slice(0, 6).join("  ")));
      /* The two fixes you are checking for. */
      if (path === "/sw.js") {
        bRows.push(row("has dev-server bypass", /DEV_SERVER_PREFIXES/.test(text) ? "YES" : "NO — old worker", /DEV_SERVER_PREFIXES/.test(text) ? "ok" : "bad"));
        bRows.push(row("has network fallback", /ignoreVary/.test(text) ? "YES" : "NO — old worker", /ignoreVary/.test(text) ? "ok" : "bad"));
      }
    } catch (e) { bRows.push(row(path, "FETCH FAILED: " + e.message, "bad")); }
  }
  blocks.push(sec("live build", bRows));

  /* ── environment that suppresses the glass ──────────────────────────── */
  const eRows = [];
  const mq = (q) => { try { return matchMedia(q).matches; } catch { return "unsupported"; } };
  eRows.push(row("prefers-reduced-transparency", mq("(prefers-reduced-transparency: reduce)"), mq("(prefers-reduced-transparency: reduce)") === true ? "bad" : "ok"));
  eRows.push(row("prefers-reduced-motion", mq("(prefers-reduced-motion: reduce)")));
  eRows.push(row("forced-colors", mq("(forced-colors: active)")));
  eRows.push(row("backdrop-filter supported", CSS.supports("backdrop-filter", "blur(1px)") || CSS.supports("-webkit-backdrop-filter", "blur(1px)"), "ok"));
  eRows.push(row("in an iframe", window.top !== window.self ? "YES (preview)" : "no (direct)"));
  eRows.push(row("viewport", innerWidth + " x " + innerHeight + "  dpr " + devicePixelRatio));
  eRows.push(row("userAgent", navigator.userAgent));
  blocks.push(sec("environment", eRows));

  out.innerHTML = blocks.join("");
})().catch((e) => { out.innerHTML = row("FATAL", e.message, "bad"); });
</script>
</body>
</html>
