<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Lighthouse notes:
      · theme-color + manifest are what move the PWA/installability audits.
      · The icon is served through the CDN resize transform; the source asset
        is an 800x800 PNG (326 KB) and this renders at 32px.
      · description/og/twitter satisfy the SEO and social-preview audits.
    -->
    <title>Home | MABIS Community Meeting App</title>
    <meta name="description" content="A shared working space for MABIS community meetings, announcements, schedules, jobs, notes and community records." />
    <meta name="theme-color" content="#951E3A" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Pre-paint theme replay.

      This deliberately runs before the critical style block and before any
      external module. The full theme module is too large for this path, but
      its last painted CSS variables are already cached as a tiny snapshot.
      Replaying that cache here prevents the loading surface from painting one
      frame of the default palette before a saved custom/Material theme lands.
      solid/main.jsx validates and replays the same snapshot again, then
      reconciles it from the authoritative theme module after first paint.
    -->
    <script id="mabis-theme-prepaint">
      (() => {
        try {
          const storedTheme = localStorage.getItem("mabis-theme") || "default";
          const storedFont = localStorage.getItem("mabis-font") || "";
          const snapshot = JSON.parse(
            localStorage.getItem("mabis-theme-snapshot-v1") || "null"
          );
          if (!snapshot?.style) return;
          if (snapshot.themeKey !== storedTheme || snapshot.fontKey !== storedFont) return;

          const root = document.documentElement;
          root.setAttribute("style", snapshot.style);

          const primary = root.style.getPropertyValue("--primary").trim();
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (primary && themeColor) themeColor.setAttribute("content", `hsl(${primary})`);

          const plainMabis = storedTheme === "default"
            && !localStorage.getItem("mabis-custom-colors")
            && !localStorage.getItem("mabis-material-seed");
          window.__mabisPrePaintTheme = {
            bodyClasses: [...new Set([
              ...(snapshot.bodyClasses || []),
              ...(plainMabis ? ["mabis-unrestricted-document-colors"] : []),
            ])],
            themeClass: snapshot.themeClass || "",
          };
        } catch {
          /* Missing, blocked or stale storage falls back to the safe dark boot. */
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />

    <!-- Organization structured data, matching the React entry. Lighthouse's
         SEO audit and search previews both read this; it was missing here. -->
    <script type="application/ld+json">{"name":"MABIS Community Meeting App","logo":"https://media.base44.com/images/public/6a2fcc3f4fec7200fed7a889/673e0301b_MabisLogo-800x800.png","@context":"https://schema.org","@type":"Organization"}</script>
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a2fcc3f4fec7200fed7a889/673e0301b_MabisLogo-800x800.png/v1/fill/w_96,h_96/icon.png" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/6a2fcc3f4fec7200fed7a889/673e0301b_MabisLogo-800x800.png/v1/fill/w_180,h_180/icon.png" />

    <meta property="og:title" content="MABIS Community Meeting App" />
    <meta property="og:description" content="A shared working space for MABIS community meetings, announcements, schedules, jobs, notes and community records." />
    <meta property="og:type" content="website" />

    <meta property="og:image" content="https://media.base44.com/images/public/6a2fcc3f4fec7200fed7a889/673e0301b_MabisLogo-800x800.png/v1/fill/w_1200,h_630/preview.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="MABIS Community Meeting App" />

    <!-- preconnect before preload: the connection must exist before the font
         request can use it, and these are same-origin-critical for first paint -->
    <link rel="preconnect" href="https://media.base44.com" crossorigin />
    <!-- The first-paint subsets, not the whole pan-Unicode faces: 287 KiB of
         font-display:block became 58 KiB. index.css declares the rest of the
         coverage on a second, non-preloaded unicode-range, which a browser
         fetches only if a character outside the subset is on screen. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/gnu-freefont/FreeMono-subset.woff2?v=3" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/gnu-freefont/FreeMonoBold-subset.woff2?v=3" />

    <!-- Inline first-paint styles + boot splash. HTML comments ship, so the
         reasoning lives in check-performance-contract.mjs, which pins both. -->
    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
        background: hsl(var(--background, 228 21% 8%));
      }
      #root:empty { min-height: 100vh; }

      /* pointer-events:none unconditionally. This is a full-viewport fixed
         overlay, and it is neutralised two ways — a sibling selector and a
         removal in main.jsx. If either misses (a host that re-mounts #root,
         a bundle that fails before render) it becomes an invisible trap that
         eats every scroll and click on the page. It never needs to receive
         input, so it should never be able to. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.5rem;
        background: hsl(var(--background, 228 21% 8%));
        color: hsl(var(--foreground, 40 32% 94%));
        font-family: "GNUFreeMonoUI", "FreeMono", ui-monospace, monospace;
        font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      }
      #boot-splash > span:first-child { opacity: 0.5; }
      #boot-splash-track {
        position: relative; overflow: hidden;
        width: min(220px, 44vw); height: 1px;
        background: hsl(var(--foreground, 40 32% 94%) / 0.15);
      }
      #boot-splash-track::after {
        content: ""; position: absolute; inset: 0 auto 0 0;
        width: 40%; background: hsl(var(--primary, 345 67% 35%));
        animation: boot-splash-sweep 1.15s ease-in-out infinite;
      }
      @keyframes boot-splash-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      /* The app is up: stand down. */
      #root:not(:empty) + #boot-splash {
        opacity: 0; visibility: hidden;
        transition: opacity 0.18s linear, visibility 0s linear 0.18s;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash-track::after { animation: none; width: 100%; opacity: 0.55; }
        #root:not(:empty) + #boot-splash { transition: none; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-h1lb5_GD.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BoQ7VGS8.css">
    <script type="module">
if (window.self === window.top) {
  let lastPath = "";
  function getPageNameFromPath(path) {
    const segments = path.split("/").filter(Boolean);
    return segments[0] || null;
  }
  function trackPageView() {
    const path = window.location.pathname;
    if (path === lastPath) return;
    lastPath = path;
    const pageName = getPageNameFromPath(path) || "home";
    const appId = "6a7aa8e1140ed92f584d3fb4";
    if (!appId) return;
    fetch(`/api/app-logs/${appId}/log-user-in-app/${pageName}`, {
      method: "POST",
    }).catch(() => {});
  }
  const originalPushState = history.pushState.bind(history);
  history.pushState = function (...args) {
    originalPushState(...args);
    trackPageView();
  };
  const originalReplaceState = history.replaceState.bind(history);
  history.replaceState = function (...args) {
    originalReplaceState(...args);
    trackPageView();
  };
  window.addEventListener("popstate", trackPageView);
  trackPageView();
}
</script>
  </head>
  <body>
    <script id="mabis-theme-body">
      (() => {
        try {
          const snapshot = window.__mabisPrePaintTheme;
          if (!snapshot) return;

          const owned = new Set(["pride-active", "theme-is-dark", "mabis-unrestricted-document-colors"]);
          for (const name of snapshot.bodyClasses) {
            if (owned.has(name)) document.body.classList.add(name);
          }
          if (/^theme-[a-z0-9_-]+$/i.test(snapshot.themeClass)) {
            document.body.classList.add(snapshot.themeClass);
            document.body.dataset.mabisThemeClass = snapshot.themeClass;
          }
        } finally {
          delete window.__mabisPrePaintTheme;
        }
      })();
    </script>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="Loading">
      <span>Initialising</span>
      <span id="boot-splash-track"></span>
    </div>
    <noscript>
      <p style="color:#e8e3d8;font-family:monospace;padding:2rem">
        This app needs JavaScript enabled.
      </p>
    </noscript>
  </body>
</html>
